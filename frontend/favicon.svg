<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base with Glow Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Gamepad Body -->
  <g filter="url(#glow)">
    <path d="M16 23 C12 23 10 27 11 36 C12 43 14 47 18 47 C21 47 23 43 26 39 C28 37 36 37 38 39 C41 43 43 47 46 47 C50 47 52 43 53 36 C54 27 52 23 48 23 C42 23 35 25 32 25 C29 25 22 23 16 23 Z" fill="url(#primaryGrad)"/>
  </g>

  <!-- D-Pad (Left side) -->
  <path d="M19 28 h3 v2 h2 v3 h-2 v2 h-3 v-2 h-2 v-3 h2 z" fill="#0b0f19"/>
  <path d="M19 28 h3 v2 h2 v3 h-2 v2 h-3 v-2 h-2 v-3 h2 z" fill="none" stroke="#38bdf8" stroke-width="0.8"/>

  <!-- Action Buttons (Right side - Diamond layout) -->
  <circle cx="43" cy="29" r="1.6" fill="#f43f5e"/>
  <circle cx="46.5" cy="32.5" r="1.6" fill="#38bdf8"/>
  <circle cx="43" cy="36" r="1.6" fill="#10b981"/>
  <circle cx="39.5" cy="32.5" r="1.6" fill="#f59e0b"/>

  <!-- Center Indicator Glow -->
  <circle cx="32" cy="30" r="1.5" fill="#38bdf8"/>
</svg>
